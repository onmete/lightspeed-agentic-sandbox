name: ACP Minimal Test

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: ambient-code/ambient-action@v0.0.5
        with:
          api-url: ${{ secrets.ACP_URL }}
          api-token: ${{ secrets.ACP_TOKEN }}
          project: ${{ vars.ACP_PROJECT || secrets.ACP_PROJECT }}
          prompt: "ping"
          wait: "true"
          poll-timeout: 5
          no-verify-ssl: ${{ vars.ACP_NO_VERIFY_SSL == 'true' && 'true' || 'false' }}
