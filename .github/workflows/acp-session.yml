# Ambient Code Platform — PR review against linked Jira acceptance criteria.
# Docs: https://ambient-code.github.io/platform/extensions/github-action/
#
# Runs on every new PR (opened). Requires Jira integration on the ACP project.
#
# Secrets (fork Settings → Actions):
#   ACP_URL     — Backend-route API URL (NOT the browser UI host). Example for vteam-uat:
#                 https://backend-route-ambient-code.apps.rosa.vteam-uat.0ksl.p3.openshiftapps.com/api
#                 UI host (ambient-code.apps.*) sits behind OAuth and strips Bearer tokens → 401.
#   ACP_TOKEN   — Project access key (Bearer), from ACP project keys
#   ACP_PROJECT — Workspace slug (e.g. ols-agents)  [can also be a variable]
# Variables (fork Settings → Actions → Variables):
#   ACP_PROJECT        — Alternative to secret; visible in logs for debugging
#   ACP_NO_VERIFY_SSL  — Set to "true" for self-signed certs

name: ACP PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

concurrency:
  group: acp-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  pr-review:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ACP_REVIEW_TESTING: "true"
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Load PR metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.number }}" \
            --jq '{title, body, headRefName: .head.ref, baseRefName: .base.ref, url: .html_url}' \
            > "${RUNNER_TEMP}/pr.json"
          echo "branch=$(jq -r '.headRefName' "${RUNNER_TEMP}/pr.json")" >> "$GITHUB_OUTPUT"

      - name: Build review prompt
        id: prompt
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_BRANCH: ${{ steps.meta.outputs.branch }}
          REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/acp_build_prompt.py

      - name: Verify ACP API URL and project
        id: acp
        env:
          ACP_URL: ${{ secrets.ACP_URL }}
          ACP_TOKEN: ${{ secrets.ACP_TOKEN }}
          ACP_PROJECT: ${{ vars.ACP_PROJECT || secrets.ACP_PROJECT }}
        run: |
          set -euo pipefail
          CURL=(curl -sS -o "${RUNNER_TEMP}/acp-probe-body.txt" -w "%{http_code}")
          if [ "${{ vars.ACP_NO_VERIFY_SSL }}" = "true" ]; then
            CURL+=(--insecure)
          fi

          probe() {
            "${CURL[@]}" -H "Authorization: Bearer ${ACP_TOKEN}" \
              "$1/projects/${ACP_PROJECT}/agentic-sessions"
          }

          base="${ACP_URL%/}"
          if echo "${base}" | grep -qE '://ambient-code\.apps\.' && ! echo "${base}" | grep -q 'backend-route'; then
            echo "::warning::ACP_URL looks like the UI host (ambient-code.apps.*). Use the backend-route host (backend-route-ambient-code.apps.*) so Bearer tokens reach the API."
          fi

          code="$(probe "${base}")"
          if [ "${code}" = "404" ] && [ "${base}" != */api ]; then
            base="${base}/api"
            code="$(probe "${base}")"
          fi

          case "${code}" in
            200|403|405) ;;
            401)
              if grep -q 'User token required' "${RUNNER_TEMP}/acp-probe-body.txt" 2>/dev/null; then
                echo "::error::ACP API returned 401 User token required — ACP_URL is likely the UI route (OAuth proxy strips Bearer). Use backend-route URL, e.g. https://backend-route-ambient-code.apps.<cluster>/api"
              else
                echo "::error::ACP API returned 401 — check ACP_TOKEN (project access key) and ACP_URL (backend-route /api, not UI host)."
              fi
              exit 1
              ;;
            404)
              echo "::error::ACP API 404 at ${base}/projects/${ACP_PROJECT}/agentic-sessions — use API base URL ending in /api (not the web UI) and verify ACP_PROJECT slug."
              exit 1
              ;;
            *)
              echo "::error::ACP API probe failed (HTTP ${code}). Check ACP_URL, ACP_TOKEN, and network access from GitHub Actions."
              exit 1
              ;;
          esac

          echo "api_url=${base}" >> "$GITHUB_OUTPUT"
          echo "Using ACP API base: ${base}"
          echo "ACP project: ${ACP_PROJECT}"

      - name: Run ACP PR review session
        id: session
        uses: ambient-code/ambient-action@v0.0.5
        with:
          api-url: ${{ steps.acp.outputs.api_url }}
          api-token: ${{ secrets.ACP_TOKEN }}
          project: ${{ vars.ACP_PROJECT || secrets.ACP_PROJECT }}
          display-name: pr-review-${{ github.repository }}-${{ steps.pr.outputs.number }}
          prompt: ${{ steps.prompt.outputs.text }}
          repos: |
            [
              {
                "url": "https://github.com/${{ github.repository }}.git",
                "branch": "${{ steps.meta.outputs.branch }}",
                "autoPush": false
              }
            ]
          wait: "true"
          poll-interval: 15
          poll-timeout: 90
          stop-on-run-finished: true
          no-verify-ssl: ${{ vars.ACP_NO_VERIFY_SSL == 'true' && 'true' || 'false' }}

      - name: Debug action outputs
        if: always()
        run: |
          echo "=== Action outputs ==="
          echo "session-name: ${{ steps.session.outputs.session-name }}"
          echo "session-phase: ${{ steps.session.outputs.session-phase }}"
          echo "session-url: ${{ steps.session.outputs.session-url }}"
          echo "session-result length: $(printf '%s' '${{ steps.session.outputs.session-result }}' | wc -c)"
          echo "=== Output file ==="
          cat "${RUNNER_TEMP}/ambient-session-output.json" 2>/dev/null | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for k, v in d.items():
              if isinstance(v, str) and len(v) > 200:
                  print(f'{k}: ({len(v)} chars) {v[:200]}...')
              else:
                  print(f'{k}: {v}')
          " || echo "(no output file)"

      - name: Fetch session result from ACP API
        id: fetch
        if: steps.session.outputs.session-name != ''
        env:
          ACP_URL: ${{ steps.acp.outputs.api_url }}
          ACP_TOKEN: ${{ secrets.ACP_TOKEN }}
          ACP_PROJECT: ${{ vars.ACP_PROJECT || secrets.ACP_PROJECT }}
          SESSION_NAME: ${{ steps.session.outputs.session-name }}
        run: |
          set -euo pipefail
          CURL_OPTS=(-sS)
          if [ "${{ vars.ACP_NO_VERIFY_SSL }}" = "true" ]; then
            CURL_OPTS+=(--insecure)
          fi
          curl "${CURL_OPTS[@]}" \
            -H "Authorization: Bearer ${ACP_TOKEN}" \
            "${ACP_URL}/projects/${ACP_PROJECT}/agentic-sessions/${SESSION_NAME}" \
            -o "${RUNNER_TEMP}/session-detail.json"
          python3 -c "
          import json, os
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'session-detail.json')) as f:
              data = json.load(f)
          result = data.get('status', {}).get('result', '') or ''
          runs = data.get('status', {}).get('runs', [])
          if not result and runs:
              last = runs[-1]
              result = last.get('result', '') or last.get('output', '') or ''
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('text<<GHEOF\n')
              out.write(result)
              out.write('\nGHEOF\n')
          print(f'Result length: {len(result)} chars')
          print(result[:500] if result else '(empty)')
          "

      - name: Parse review closure
        id: closure
        env:
          SESSION_RESULT: ${{ steps.fetch.outputs.text || steps.session.outputs.session-result }}
        run: |
          set -euo pipefail
          printf '%s' "$SESSION_RESULT" > "${RUNNER_TEMP}/session-result.txt"
          python3 .github/scripts/acp_parse_closure.py

      - name: Post review on PR
        if: steps.session.outputs.session-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SESSION_URL: ${{ steps.session.outputs.session-url }}
          SESSION_PHASE: ${{ steps.session.outputs.session-phase }}
        run: |
          set -euo pipefail
          BODY_FILE="${RUNNER_TEMP}/review-public.md"
          if [ ! -f "$BODY_FILE" ]; then
            printf '%s' "${{ steps.session.outputs.session-result }}" > "$BODY_FILE"
          fi
          {
            echo "## Ambient PR review (Jira AC)"
            echo ""
            echo "**Session:** [${SESSION_PHASE}](${SESSION_URL})"
            if [ "${{ steps.closure.outputs.found }}" = "true" ]; then
              echo ""
              echo "**Verdict:** \`${{ steps.closure.outputs.verdict }}\` — ${{ steps.closure.outputs.summary }}"
            fi
            echo ""
            cat "$BODY_FILE"
          } > "${RUNNER_TEMP}/review-comment.md"
          gh api \
            --method POST \
            "repos/${{ github.repository }}/issues/${{ steps.pr.outputs.number }}/comments" \
            -f body="$(cat "${RUNNER_TEMP}/review-comment.md")"

      - name: Fail job if acceptance criteria not met
        env:
          SESSION_PHASE: ${{ steps.session.outputs.session-phase }}
          ACP_FAIL_ON_AC_MISS: ${{ vars.ACP_FAIL_ON_AC_MISS != 'false' && 'true' || 'false' }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          case "$SESSION_PHASE" in
            Completed|Running|Stopped) ;;
            *)
              fail "ACP session ended with phase: ${SESSION_PHASE:-unknown}"
              ;;
          esac

          if [ "$ACP_FAIL_ON_AC_MISS" != "true" ]; then
            echo "ACP_FAIL_ON_AC_MISS is false — skipping closure gate."
            exit 0
          fi

          if [ "${{ steps.closure.outputs.found }}" != "true" ]; then
            fail "Missing AC_REVIEW_CLOSURE block in agent output. See prompt for required format."
          fi

          VERDICT="${{ steps.closure.outputs.verdict }}"
          case "$VERDICT" in
            PASS|FAIL|WARN) ;;
            *)
              fail "Invalid or missing VERDICT in closure (got: '${VERDICT:-empty}'). Expected PASS, FAIL, or WARN."
              ;;
          esac

          if [ "$ACP_REVIEW_TESTING" = "true" ]; then
            SMOKE="${{ steps.closure.outputs.smoke_test }}"
            if [ -n "$SMOKE" ] && [ "$SMOKE" != "OK" ] && [ "$VERDICT" = "PASS" ]; then
              fail "Closure inconsistent: VERDICT=PASS but SMOKE_TEST=${SMOKE}"
            fi
          else
            NOT_MET="${{ steps.closure.outputs.criteria_not_met }}"
            if [ -n "$NOT_MET" ] && [ "$NOT_MET" -gt 0 ] 2>/dev/null && [ "$VERDICT" = "PASS" ]; then
              fail "Closure inconsistent: VERDICT=PASS but CRITERIA_NOT_MET=${NOT_MET}"
            fi
            if [ "$VERDICT" = "PASS" ]; then
              MET="${{ steps.closure.outputs.criteria_met }}"
              TOTAL="${{ steps.closure.outputs.criteria_total }}"
              if [ -n "$TOTAL" ] && [ "$TOTAL" -gt 0 ] 2>/dev/null && [ -n "$MET" ] && [ "$MET" != "$TOTAL" ]; then
                fail "Closure inconsistent: CRITERIA_MET (${MET}) != CRITERIA_TOTAL (${TOTAL}) with VERDICT=PASS"
              fi
            fi
          fi

          echo "Closure verdict: $VERDICT"
          echo "Summary: ${{ steps.closure.outputs.summary }}"
          case "$VERDICT" in
            PASS) ;;
            WARN) fail "Review inconclusive (${VERDICT}): ${{ steps.closure.outputs.summary }}" ;;
            FAIL) fail "Acceptance criteria not met (${VERDICT}): ${{ steps.closure.outputs.summary }}" ;;
          esac

      - name: Summary
        run: |
          {
            echo "### ACP PR review (Jira AC)"
            echo "- **PR:** #${{ steps.pr.outputs.number }}"
            echo "- **Branch:** ${{ steps.meta.outputs.branch }}"
            echo "- **Session:** ${{ steps.session.outputs.session-url }}"
            echo "- **Phase:** ${{ steps.session.outputs.session-phase }}"
            if [ "${{ steps.closure.outputs.found }}" = "true" ]; then
              echo "- **Verdict:** ${{ steps.closure.outputs.verdict }}"
              echo "- **Jira:** ${{ steps.closure.outputs.jira_keys }}"
              echo "- **Summary:** ${{ steps.closure.outputs.summary }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
